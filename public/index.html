<!DOCTYPE html>
<html lang="en">
<head>
  <base href="./">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube Downloader</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-gradient: radial-gradient(circle at 50% 0%, #1a1a2e 0%, #0d0e15 100%);
      --card-bg: rgba(26, 27, 38, 0.85);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent: #ff0050;
      --accent-hover: #ff2b6d;
      --accent-glow: rgba(255, 0, 80, 0.35);
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --input-bg: rgba(15, 16, 23, 0.9);
      --input-border: rgba(255, 255, 255, 0.12);
      --progress-bg: #2a2b3d;
      --success: #10b981;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      min-height: 100vh;
      background: var(--bg-gradient);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    .container {
      width: 100%;
      max-width: 580px;
    }

    .header {
      text-align: center;
      margin-bottom: 28px;
    }

    .logo-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 0, 80, 0.12);
      border: 1px solid rgba(255, 0, 80, 0.25);
      color: #ff4d79;
      padding: 6px 14px;
      border-radius: 9999px;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .header h1 {
      font-size: 2.2rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
    }

    .header p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 28px;
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.6);
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-wrapper input {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      color: var(--text-main);
      padding: 14px 16px;
      padding-right: 80px;
      border-radius: 12px;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s ease;
    }

    .input-wrapper input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .paste-btn {
      position: absolute;
      right: 8px;
      background: rgba(255, 255, 255, 0.08);
      border: none;
      color: var(--text-main);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .paste-btn:hover {
      background: rgba(255, 255, 255, 0.16);
    }

    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 24px;
    }

    .format-selector {
      display: flex;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 12px;
      padding: 4px;
    }

    .format-btn {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 8px 12px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.88rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .format-btn.active {
      background: var(--accent);
      color: #fff;
      box-shadow: 0 2px 8px var(--accent-glow);
    }

    .select-dropdown {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      color: var(--text-main);
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 0.9rem;
      outline: none;
      cursor: pointer;
      transition: border-color 0.2s;
    }

    .select-dropdown:focus {
      border-color: var(--accent);
    }

    .btn-submit {
      width: 100%;
      background: var(--accent);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 15px var(--accent-glow);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-submit:hover:not(:disabled) {
      background: var(--accent-hover);
      transform: translateY(-1px);
    }

    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* Video Preview */
    .video-preview {
      display: flex;
      gap: 14px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 12px;
      margin-bottom: 20px;
      align-items: center;
    }

    .video-preview img {
      width: 110px;
      height: 64px;
      object-fit: cover;
      border-radius: 8px;
      flex-shrink: 0;
    }

    .preview-details {
      overflow: hidden;
      flex: 1;
    }

    .preview-details h3 {
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 4px;
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .preview-meta {
      display: flex;
      gap: 10px;
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    /* Status & Progress Section */
    .status-panel {
      display: none;
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid var(--card-border);
    }

    .status-panel.active {
      display: block;
    }

    .progress-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.88rem;
      margin-bottom: 8px;
    }

    .progress-bar-bg {
      width: 100%;
      height: 10px;
      background: var(--progress-bg);
      border-radius: 9999px;
      overflow: hidden;
      margin-bottom: 12px;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #ff0050, #ff5e3a);
      border-radius: 9999px;
      transition: width 0.3s ease;
    }

    .action-row {
      display: flex;
      gap: 10px;
      margin-top: 14px;
    }

    .btn-action {
      flex: 1;
      padding: 10px;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 600;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      text-decoration: none;
    }

    .btn-download {
      background: var(--success);
      color: white;
    }

    .btn-cancel {
      background: rgba(239, 68, 68, 0.15);
      color: var(--danger);
      border: 1px solid rgba(239, 68, 68, 0.3);
    }

    .btn-cancel:hover {
      background: rgba(239, 68, 68, 0.25);
    }

    .alert {
      display: none;
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 0.88rem;
      margin-top: 16px;
    }

    .alert-error {
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5;
    }

    .footer {
      text-align: center;
      margin-top: 24px;
      font-size: 0.8rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="logo-badge">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
          <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
        </svg>
        Cloud Ready
      </div>
      <h1>YouTube Downloader</h1>
      <p>Download high quality MP4 video or MP3 audio seamlessly</p>
    </div>

    <div class="card">
      <form id="downloadForm">
        <div class="form-group">
          <label for="videoUrl">Video URL</label>
          <div class="input-wrapper">
            <input 
              type="text" 
              id="videoUrl" 
              placeholder="https://www.youtube.com/watch?v=..." 
              required 
              autocomplete="off"
            />
            <button type="button" class="paste-btn" id="pasteBtn">Paste</button>
          </div>
        </div>

        <!-- Dynamic Video Preview -->
        <div id="videoPreview" class="video-preview" style="display: none;">
          <img id="previewThumb" src="" alt="Thumbnail" />
          <div class="preview-details">
            <h3 id="previewTitle"></h3>
            <div class="preview-meta">
              <span id="previewChannel"></span>
              <span id="previewDuration"></span>
            </div>
          </div>
        </div>
        <div id="loadingInfo" style="display: none; font-size: 0.85rem; color: #a1a1aa; margin-bottom: 16px; text-align: center;">
          Detecting available qualities...
        </div>

        <div class="options-grid">
          <div>
            <label>Format</label>
            <div class="format-selector">
              <button type="button" class="format-btn active" data-format="mp4">MP4 (Video)</button>
              <button type="button" class="format-btn" data-format="mp3">MP3 (Audio)</button>
            </div>
          </div>

          <div>
            <label for="qualitySelect">Quality</label>
            <select id="qualitySelect" class="select-dropdown">
              <!-- Filled dynamically based on format -->
            </select>
          </div>
        </div>

        <button type="submit" class="btn-submit" id="submitBtn">
          <span>Start Download</span>
        </button>
      </form>

      <div class="alert alert-error" id="errorAlert"></div>

      <!-- Live Status & Progress Section -->
      <div class="status-panel" id="statusPanel">
        <div class="progress-header">
          <span id="statusText">Processing...</span>
          <span id="progressPercent">0%</span>
        </div>
        <div class="progress-bar-bg">
          <div class="progress-bar-fill" id="progressBar"></div>
        </div>
        <div id="fileInfo" style="font-size: 0.85rem; color: var(--text-muted); word-break: break-all; margin-bottom: 8px;"></div>
        <div class="action-row" id="actionRow">
          <button type="button" class="btn-action btn-cancel" id="cancelBtn">Cancel</button>
          <a class="btn-action btn-download" id="downloadFileBtn" style="display: none;" download>Save File</a>
        </div>
      </div>
    </div>

    <div class="footer">
      Powered by Node.js & yt-dlp
    </div>
  </div>

  <script>
    const qualities = {
      mp4: [
        { label: '1080p Full HD', value: '1080' },
        { label: '720p HD (Default)', value: '720', selected: true },
        { label: '480p SD', value: '480' },
        { label: '360p Low', value: '360' }
      ],
      mp3: [
        { label: '320 kbps (High Quality)', value: '320' },
        { label: '256 kbps', value: '256' },
        { label: '192 kbps (Default)', value: '192', selected: true },
        { label: '128 kbps', value: '128' }
      ]
    };

    let currentFormat = 'mp4';
    let currentJobId = null;
    let pollInterval = null;

    const form = document.getElementById('downloadForm');
    const videoUrlInput = document.getElementById('videoUrl');
    const pasteBtn = document.getElementById('pasteBtn');
    const formatBtns = document.querySelectorAll('.format-btn');
    const qualitySelect = document.getElementById('qualitySelect');
    const submitBtn = document.getElementById('submitBtn');
    const errorAlert = document.getElementById('errorAlert');

    const statusPanel = document.getElementById('statusPanel');
    const statusText = document.getElementById('statusText');
    const progressPercent = document.getElementById('progressPercent');
    const progressBar = document.getElementById('progressBar');
    const fileInfo = document.getElementById('fileInfo');
    const cancelBtn = document.getElementById('cancelBtn');
    const downloadFileBtn = document.getElementById('downloadFileBtn');

    let currentVideoQualities = qualities.mp4;
    let currentAudioQualities = qualities.mp3;
    let lastFetchedUrl = '';
    let debounceTimer = null;

    function updateQualityDropdown(format) {
      qualitySelect.innerHTML = '';
      const list = format === 'mp4' ? currentVideoQualities : currentAudioQualities;
      list.forEach(opt => {
        const option = document.createElement('option');
        option.value = opt.value;
        option.textContent = opt.label;
        if (opt.selected) option.selected = true;
        qualitySelect.appendChild(option);
      });
    }

    updateQualityDropdown(currentFormat);

    formatBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        formatBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFormat = btn.dataset.format;
        updateQualityDropdown(currentFormat);
      });
    });

    async function fetchVideoInfo(url) {
      if (!url || !/^https?:\/\/(www\.)?(youtube\.com|youtu\.be)\//i.test(url)) {
        document.getElementById('videoPreview').style.display = 'none';
        currentVideoQualities = qualities.mp4;
        currentAudioQualities = qualities.mp3;
        updateQualityDropdown(currentFormat);
        return;
      }
      if (url === lastFetchedUrl) return;
      lastFetchedUrl = url;

      const loadingInfo = document.getElementById('loadingInfo');
      const videoPreview = document.getElementById('videoPreview');
      const previewThumb = document.getElementById('previewThumb');
      const previewTitle = document.getElementById('previewTitle');
      const previewChannel = document.getElementById('previewChannel');
      const previewDuration = document.getElementById('previewDuration');

      loadingInfo.style.display = 'block';

      try {
        const res = await fetch('info', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url })
        });
        if (!res.ok) throw new Error('Info request failed');
        const data = await res.json();

        if (data.ok) {
          if (Array.isArray(data.videoQualities) && data.videoQualities.length > 0) {
            currentVideoQualities = data.videoQualities;
          }
          if (Array.isArray(data.audioQualities) && data.audioQualities.length > 0) {
            currentAudioQualities = data.audioQualities;
          }

          if (data.thumbnail) {
            previewThumb.src = data.thumbnail;
            previewTitle.textContent = data.title;
            previewChannel.textContent = data.channel || '';
            previewDuration.textContent = data.duration ? `⏱ ${data.duration}` : '';
            videoPreview.style.display = 'flex';
          }

          updateQualityDropdown(currentFormat);
        }
      } catch (err) {
        console.warn('Fallback to standard qualities:', err.message);
      } finally {
        loadingInfo.style.display = 'none';
      }
    }

    videoUrlInput.addEventListener('input', () => {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(() => {
        fetchVideoInfo(videoUrlInput.value.trim());
      }, 500);
    });

    pasteBtn.addEventListener('click', async () => {
      try {
        const text = await navigator.clipboard.readText();
        if (text) {
          videoUrlInput.value = text.trim();
          fetchVideoInfo(text.trim());
        }
      } catch (err) {
        videoUrlInput.focus();
      }
    });

    function showError(msg) {
      errorAlert.textContent = msg;
      errorAlert.style.display = 'block';
    }

    function hideError() {
      errorAlert.style.display = 'none';
      errorAlert.textContent = '';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideError();

      const url = videoUrlInput.value.trim();
      const quality = qualitySelect.value;

      if (!url) {
        showError('Please enter a YouTube video URL.');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span>Starting job...</span>';
      statusPanel.classList.add('active');
      statusText.textContent = 'Initializing download...';
      progressPercent.textContent = '0%';
      progressBar.style.width = '0%';
      fileInfo.textContent = '';
      cancelBtn.style.display = 'inline-flex';
      downloadFileBtn.style.display = 'none';

      try {
        const res = await fetch('download', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            url,
            format: currentFormat,
            quality
          })
        });

        const data = await res.json();
        if (!res.ok || !data.success) {
          throw new Error(data.error || 'Failed to start download job.');
        }

        currentJobId = data.jobId;
        startPolling(currentJobId);
      } catch (err) {
        showError(err.message);
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<span>Start Download</span>';
        statusPanel.classList.remove('active');
      }
    });

    function startPolling(jobId) {
      if (pollInterval) clearInterval(pollInterval);

      pollInterval = setInterval(async () => {
        try {
          const res = await fetch(`status/${jobId}`);
          if (!res.ok) {
            clearInterval(pollInterval);
            showError('Unable to fetch job status.');
            submitBtn.disabled = false;
            submitBtn.innerHTML = '<span>Start Download</span>';
            return;
          }

          const data = await res.json();

          if (data.status === 'downloading' || data.status === 'starting') {
            statusText.textContent = 'Downloading media...';
            const pct = Math.round(data.progress || 0);
            progressPercent.textContent = `${pct}%`;
            progressBar.style.width = `${pct}%`;
            if (data.filename) {
              fileInfo.textContent = `File: ${data.filename}`;
            }
          } else if (data.status === 'completed') {
            clearInterval(pollInterval);
            statusText.textContent = 'Download Complete!';
            progressPercent.textContent = '100%';
            progressBar.style.width = '100%';
            submitBtn.disabled = false;
            submitBtn.innerHTML = '<span>Start Download</span>';
            cancelBtn.style.display = 'none';
            downloadFileBtn.style.display = 'inline-flex';
            downloadFileBtn.href = data.downloadUrl;
            downloadFileBtn.textContent = `Save ${data.filename || 'File'}`;
            if (data.filename) {
              fileInfo.textContent = `File ready: ${data.filename}`;
            }
          } else if (data.status === 'error') {
            clearInterval(pollInterval);
            showError(data.error || 'Download failed.');
            statusPanel.classList.remove('active');
            submitBtn.disabled = false;
            submitBtn.innerHTML = '<span>Start Download</span>';
          } else if (data.status === 'cancelled') {
            clearInterval(pollInterval);
            showError('Download was cancelled.');
            statusPanel.classList.remove('active');
            submitBtn.disabled = false;
            submitBtn.innerHTML = '<span>Start Download</span>';
          }
        } catch (err) {
          console.error(err);
        }
      }, 800);
    }

    cancelBtn.addEventListener('click', async () => {
      if (!currentJobId) return;
      try {
        await fetch(`cancel/${currentJobId}`, { method: 'POST' });
        if (pollInterval) clearInterval(pollInterval);
        statusPanel.classList.remove('active');
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<span>Start Download</span>';
      } catch (err) {
        console.error(err);
      }
    });
  </script>
</body>
</html>
